<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Emotion Detector</h1>

        <p class="subtitle">
            Enter a statement to analyze its emotional tone.
        </p>

        <label for="textToAnalyze">Enter your statement:</label>

        <textarea
            id="textToAnalyze"
            placeholder="Example: I am extremely happy today!"
            rows="5"
        ></textarea>

        <button onclick="detectEmotion()">
            Detect Emotion
        </button>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function detectEmotion() {
            const text = document
                .getElementById("textToAnalyze")
                .value
                .trim();

            const resultBox = document.getElementById("result");

            if (!text) {
                resultBox.innerHTML =
                    "<p class='error'>Invalid input! Try again.</p>";
                return;
            }

            try {
                const response = await fetch(
                    "/emotionDetector?textToAnalyze=" +
                    encodeURIComponent(text)
                );

                const data = await response.json();

                if (!response.ok) {
                    resultBox.innerHTML =
                        "<p class='error'>" +
                        (data.response || "Invalid input! Try again.") +
                        "</p>";
                    return;
                }

                resultBox.innerHTML = `
                    <h2>Emotion Analysis</h2>
                    <p><strong>Anger:</strong> ${data.anger}</p>
                    <p><strong>Disgust:</strong> ${data.disgust}</p>
                    <p><strong>Fear:</strong> ${data.fear}</p>
                    <p><strong>Joy:</strong> ${data.joy}</p>
                    <p><strong>Sadness:</strong> ${data.sadness}</p>
                    <p class="dominant">
                        <strong>Dominant Emotion:</strong>
                        ${data.dominant_emotion}
                    </p>
                `;
            } catch (error) {
                resultBox.innerHTML =
                    "<p class='error'>Unable to connect to the server.</p>";
            }
        }
    </script>
</body>
</html>
